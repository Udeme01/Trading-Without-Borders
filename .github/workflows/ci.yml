name: CI

# When this workflow runs:
# - Every push to main
# - Every pull request targeting main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out your repo's code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js (match this to your local Node version if possible)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies exactly as specified in package-lock.json
      - name: Install dependencies
        run: npm ci

      # 4. Run ESLint (Next.js ships with lint config by default)
      - name: Run lint
        run: npm run lint

      # 5. Make sure the app actually builds — this catches type errors,
      #    broken imports, missing env vars used at build time, etc.
      - name: Build project
        run: npm run build
